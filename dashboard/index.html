<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tennis Quant Engine</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;background:#08111f;color:#e8eef8}body{margin:0;padding:32px}.wrap{max-width:1180px;margin:auto}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end}.muted{color:#8fa1b8}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:24px 0}.card,.row{background:#0d1a2b;border:1px solid #1c3048;border-radius:16px;padding:18px}.value{font-size:30px;font-weight:800;margin-top:6px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:54px 1.5fr .7fr .8fr .8fr;align-items:center}.rank{font-size:22px;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#15304d}.ok{color:#75e6a4}.warn{color:#f1ca6f}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){body{padding:18px}.row{grid-template-columns:42px 1fr}.row>*:nth-child(n+3){margin-top:6px}.hero{display:block}}
  </style>
</head>
<body><main class="wrap">
  <div class="hero"><div><div class="muted">MODELO QUANTITATIVO SELETIVO</div><h1>Tennis Quant Engine</h1><div id="date" class="muted">Carregando…</div></div><div class="pill">Máximo 10 seleções</div></div>
  <section class="cards"><div class="card"><div class="muted">Jogos analisados</div><div id="fixtures" class="value">–</div></div><div class="card"><div class="muted">Lados avaliados</div><div id="candidates" class="value">–</div></div><div class="card"><div class="muted">Aprovados</div><div id="approved" class="value ok">–</div></div><div class="card"><div class="muted">Shadow</div><div id="shadow" class="value warn">–</div></div><div class="card"><div class="muted">Acerto últimas 100</div><div id="acc100" class="value">–</div></div></section>
  <h2>Top selecionados</h2><div id="list" class="list"></div>
</main><script>
const pct=v=>v==null?'–':`${(v*100).toFixed(1)}%`; const num=v=>Number(v).toFixed(2);
fetch('./data.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{date.textContent=`${d.date} • ${d.model_version}`;fixtures.textContent=d.fixtures_analyzed;candidates.textContent=d.candidate_sides;approved.textContent=d.approved.length;shadow.textContent=d.shadow.length;acc100.textContent=pct(d.metrics?.last_100?.accuracy);list.innerHTML=d.approved.length?d.approved.map(x=>`<div class="row"><div class="rank">#${x.rank}</div><div><strong>${x.selected_player.name}</strong><div class="muted">vs ${x.opponent.name} • ${x.match.tournament}</div></div><div><span class="muted">Odd</span><br>${num(x.selected_market.best_odd)}</div><div><span class="muted">Prob.</span><br>${pct(x.final_probability)}</div><div><span class="muted">Conf.</span><br>${num(x.confidence)}</div></div>`).join(''):'<div class="card muted">Nenhuma seleção atingiu o padrão hoje.</div>'}).catch(()=>{date.textContent='Ainda não há análise publicada. Execute o workflow após configurar API_TENNIS_KEY.'});
</script></body></html>
