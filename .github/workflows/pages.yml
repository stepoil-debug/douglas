name: Deploy InvestBet Football dashboard

on:
  workflow_run:
    workflows: ["InvestBet Football - Analyze"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/football/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage football dashboard
        shell: bash
        run: |
          set -euo pipefail
          cp dashboard/v2.html dashboard/index.html
          mkdir -p dashboard/history
          if compgen -G "data/football/history/*.json" > /dev/null; then
            cp data/football/history/*.json dashboard/history/
          fi
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          # Every Pages deploy receives unique JS URLs in BOTH entry pages.
          # This prevents iPhone/Safari from reusing an older dashboard controller.
          build = os.environ.get('GITHUB_SHA', 'build')[:12]
          for page_name in ('index.html', 'v2.html'):
              page = Path('dashboard') / page_name
              html = page.read_text(encoding='utf-8')
              for script_name in ('manual-trigger.js', 'analysis-watch.js'):
                  html = re.sub(
                      rf'{re.escape(script_name)}(?:\?v=[^"\']*)?',
                      f'{script_name}?v={build}',
                      html,
                  )
              if 'name="investbet-build"' in html:
                  html = re.sub(
                      r'<meta name="investbet-build" content="[^"]*">',
                      f'<meta name="investbet-build" content="{build}">',
                      html,
                  )
              else:
                  html = html.replace('</head>', f'<meta name="investbet-build" content="{build}">\n</head>')
              page.write_text(html, encoding='utf-8')

          rows = []
          for path in sorted(Path('data/football/history').glob('????-??-??.json'), reverse=True):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              rows.append({
                  'date': data.get('board_date', path.stem),
                  'last_run_at': data.get('last_run_at'),
                  'approved': len(data.get('approved') or []),
                  'history_summary': data.get('history_summary') or {},
              })
          Path('dashboard/history/index.json').write_text(
              json.dumps({'sport': 'football', 'updated_at': datetime.now(timezone.utc).isoformat(), 'dates': rows}, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
