name: Deploy dashboard

on:
  workflow_run:
    workflows: ["Tennis Quant - Analyze"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/history/**'
      - 'data/learning/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage InvestBet dashboard data
        run: |
          mkdir -p dashboard/history dashboard/learning
          if compgen -G "data/history/*.json" > /dev/null; then
            cp data/history/*.json dashboard/history/
          fi
          if compgen -G "data/learning/????-??-??.json" > /dev/null; then
            cp data/learning/????-??-??.json dashboard/learning/
          fi
          # v2 is the canonical production dashboard. Keeping the source file separate
          # lets the previous panel remain recoverable while Pages serves the new UI.
          cp dashboard/v2.html dashboard/index.html
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          index_path = Path('dashboard/index.html')
          html = index_path.read_text(encoding='utf-8')
          scripts = [
              '<script src="manual-trigger.js"></script>',
              '<script src="history-audit.js"></script>',
          ]
          changed = False
          for trigger in scripts:
              if trigger not in html:
                  html = html.replace('</body>', f'{trigger}</body>')
                  changed = True
          if changed:
              index_path.write_text(html, encoding='utf-8')

          out = []
          for path in sorted(Path('data/history').glob('????-??-??.json'), reverse=True):
              try:
                  row = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              out.append({
                  'date': row.get('date', path.stem),
                  'updated_at': row.get('updated_at'),
                  'summary': row.get('summary', {}),
              })
          index = {'updated_at': datetime.now(timezone.utc).isoformat(), 'dates': out}
          Path('dashboard/history/index.json').write_text(json.dumps(index, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
