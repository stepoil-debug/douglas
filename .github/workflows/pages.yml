name: Deploy InvestBet Football dashboard

on:
  workflow_run:
    workflows: ["InvestBet Football - Analyze", "InvestBet Football - Settle Results"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/football/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stage football dashboard
        shell: bash
        run: |
          set -euo pipefail
          cp dashboard/v2.html dashboard/index.html
          mkdir -p dashboard/history
          if compgen -G "data/football/history/*.json" > /dev/null; then
            cp data/football/history/*.json dashboard/history/
          fi
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          build = os.environ.get('GITHUB_SHA', 'build')[:12]
          for page_name in ('index.html', 'v2.html'):
              page = Path('dashboard') / page_name
              html = page.read_text(encoding='utf-8')
              for script_name in ('manual-trigger.js', 'analysis-watch.js'):
                  html = re.sub(
                      rf'{re.escape(script_name)}(?:\?v=[^"\']*)?',
                      f'{script_name}?v={build}',
                      html,
                  )
              if 'name="investbet-build"' in html:
                  html = re.sub(
                      r'<meta name="investbet-build" content="[^"]*">',
                      f'<meta name="investbet-build" content="{build}">',
                      html,
                  )
              else:
                  html = html.replace('</head>', f'<meta name="investbet-build" content="{build}">\n</head>')
              page.write_text(html, encoding='utf-8')

          rows = []
          for path in sorted(Path('data/football/history').glob('????-??-??.json'), reverse=True):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              tickets = data.get('tickets') or data.get('approved') or []
              settlement = data.get('settlement') or {}
              if not settlement:
                  green = sum(1 for t in tickets if str(t.get('status') or '').upper() == 'GREEN')
                  red = sum(1 for t in tickets if str(t.get('status') or '').upper() == 'RED')
                  pending = sum(1 for t in tickets if str(t.get('status') or 'PENDING').upper() in {'PENDING','MANUAL'})
                  settlement = {
                      'green': green,
                      'red': red,
                      'pending': pending,
                      'complete': bool(tickets) and pending == 0,
                  }
              rows.append({
                  'date': data.get('board_date', path.stem),
                  'last_run_at': data.get('last_run_at'),
                  'tickets': len(tickets),
                  'approved': len(data.get('approved') or []),
                  'board_status': data.get('board_status') or '',
                  'settlement': settlement,
                  'history_summary': data.get('history_summary') or {},
              })
          Path('dashboard/history/index.json').write_text(
              json.dumps({'sport': 'football', 'updated_at': datetime.now(timezone.utc).isoformat(), 'dates': rows}, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public dashboard is current
        id: verify_public
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          EXPECTED_DATE="$(jq -r '.board_date // empty' dashboard/run_status.json)"
          EXPECTED_STATUS="$(jq -r '.status // empty' dashboard/run_status.json)"
          BUILD="${GITHUB_SHA:0:12}"
          OK=0

          for attempt in $(seq 1 24); do
            ROOT="$(curl -fsSL --retry 2 --retry-delay 2 "${BASE}/?verify=${GITHUB_SHA}" || true)"
            V2="$(curl -fsSL --retry 2 --retry-delay 2 "${BASE}/v2.html?verify=${GITHUB_SHA}" || true)"
            STATUS="$(curl -fsSL --retry 2 --retry-delay 2 "${BASE}/run_status.json?verify=${GITHUB_SHA}" || true)"
            ARCHIVE="$(curl -fsSL --retry 2 --retry-delay 2 "${BASE}/bilhetes.html?verify=${GITHUB_SHA}" || true)"
            PUBLIC_DATE="$(printf '%s' "$STATUS" | jq -r '.board_date // empty' 2>/dev/null || true)"
            PUBLIC_STATUS="$(printf '%s' "$STATUS" | jq -r '.status // empty' 2>/dev/null || true)"

            ROOT_OK=0; V2_OK=0; WATCH_OK=0; MANUAL_OK=0; BUILD_OK=0; ARCHIVE_OK=0
            printf '%s' "$ROOT" | grep -q "analysis-watch.js?v=${BUILD}" && ROOT_OK=1 || true
            printf '%s' "$V2" | grep -q "analysis-watch.js?v=${BUILD}" && V2_OK=1 || true
            printf '%s' "$V2" | grep -q "manual-trigger.js?v=${BUILD}" && MANUAL_OK=1 || true
            printf '%s' "$V2" | grep -q "investbet-build.*${BUILD}" && BUILD_OK=1 || true
            printf '%s' "$ARCHIVE" | grep -q 'Histórico de bilhetes' && ARCHIVE_OK=1 || true
            WATCH_BODY="$(curl -fsSL --retry 2 --retry-delay 2 "${BASE}/analysis-watch.js?v=${BUILD}" || true)"
            printf '%s' "$WATCH_BODY" | grep -q 'POLL_MS = 5000' && WATCH_OK=1 || true

            if [ "$ROOT_OK" = 1 ] && [ "$V2_OK" = 1 ] && [ "$WATCH_OK" = 1 ] && [ "$MANUAL_OK" = 1 ] && [ "$BUILD_OK" = 1 ] && [ "$ARCHIVE_OK" = 1 ] \
               && [ "$PUBLIC_DATE" = "$EXPECTED_DATE" ] && [ "$PUBLIC_STATUS" = "$EXPECTED_STATUS" ]; then
              OK=1
              break
            fi
            echo "Attempt ${attempt}: page not fully current yet (public=${PUBLIC_DATE}/${PUBLIC_STATUS}, expected=${EXPECTED_DATE}/${EXPECTED_STATUS})."
            sleep 10
          done

          mkdir -p data
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg checked_at "$NOW" \
            --arg page_url "$BASE/" \
            --arg commit "$GITHUB_SHA" \
            --arg expected_date "$EXPECTED_DATE" \
            --arg public_date "${PUBLIC_DATE:-}" \
            --arg public_status "${PUBLIC_STATUS:-}" \
            --argjson healthy "$([ "$OK" = 1 ] && echo true || echo false)" \
            '{healthy:$healthy,checked_at:$checked_at,page_url:$page_url,commit:$commit,expected_date:$expected_date,public_date:$public_date,public_status:$public_status}' \
            > data/pages-health.json

          echo "healthy=$OK" >> "$GITHUB_OUTPUT"
          if [ "$OK" != 1 ]; then
            echo 'Public GitHub Pages validation failed.' >&2
          fi

      - name: Persist Pages health report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- dashboard/v2.html || true
          git config user.name 'investbet-pages-bot'
          git config user.email 'investbet-pages-bot@users.noreply.github.com'
          git add data/pages-health.json
          if git diff --cached --quiet; then
            echo 'Pages health report unchanged.'
          else
            git commit -m 'chore: update InvestBet Pages health report'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail unhealthy deploy
        if: steps.verify_public.outputs.healthy != '1'
        shell: bash
        run: exit 1
