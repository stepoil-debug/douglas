name: Verify InvestBet Public Dashboard

# Recheck public Pages after restoring the manually selected board.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify public Pages files
        id: verify
        shell: bash
        run: |
          set -u
          BASE='https://stepoil-debug.github.io/douglas'
          EXPECTED_DATE="$(jq -r '.board_date // empty' dashboard/run_status.json)"
          OK=0
          PUBLIC_DATE=''
          PUBLIC_STATUS=''
          WATCHER_PRESENT=false
          FRESH_SCRIPTS=false

          for attempt in $(seq 1 30); do
            ROOT="$(curl -LfsS --max-time 20 "${BASE}/?probe=$(date +%s)" 2>/dev/null || true)"
            V2="$(curl -LfsS --max-time 20 "${BASE}/v2.html?probe=$(date +%s)" 2>/dev/null || true)"
            STATUS="$(curl -LfsS --max-time 20 "${BASE}/run_status.json?probe=$(date +%s)" 2>/dev/null || true)"
            WATCH="$(curl -LfsS --max-time 20 "${BASE}/analysis-watch.js?probe=$(date +%s)" 2>/dev/null || true)"

            PUBLIC_DATE="$(printf '%s' "$STATUS" | jq -r '.board_date // empty' 2>/dev/null || true)"
            PUBLIC_STATUS="$(printf '%s' "$STATUS" | jq -r '.status // empty' 2>/dev/null || true)"
            WATCHER_PRESENT=false
            FRESH_SCRIPTS=false
            printf '%s' "$WATCH" | grep -q 'POLL_MS = 5000' && WATCHER_PRESENT=true || true
            if printf '%s' "$ROOT" | grep -q 'analysis-watch.js?v=' && printf '%s' "$V2" | grep -q 'analysis-watch.js?v=' && printf '%s' "$V2" | grep -q 'manual-trigger.js?v='; then
              FRESH_SCRIPTS=true
            fi

            if [ "$PUBLIC_DATE" = "$EXPECTED_DATE" ] && [ "$PUBLIC_STATUS" = 'SUCCESS' ] && [ "$WATCHER_PRESENT" = true ] && [ "$FRESH_SCRIPTS" = true ]; then
              OK=1
              break
            fi
            echo "Attempt ${attempt}: public=${PUBLIC_DATE}/${PUBLIC_STATUS} expected=${EXPECTED_DATE}, watcher=${WATCHER_PRESENT}, fresh=${FRESH_SCRIPTS}"
            sleep 10
          done

          mkdir -p data
          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg expected_date "$EXPECTED_DATE" \
            --arg public_date "$PUBLIC_DATE" \
            --arg public_status "$PUBLIC_STATUS" \
            --argjson watcher_present "$WATCHER_PRESENT" \
            --argjson fresh_scripts "$FRESH_SCRIPTS" \
            --argjson healthy "$([ "$OK" = 1 ] && echo true || echo false)" \
            '{healthy:$healthy,checked_at:$checked_at,expected_date:$expected_date,public_date:$public_date,public_status:$public_status,watcher_present:$watcher_present,fresh_scripts:$fresh_scripts,page_url:"https://stepoil-debug.github.io/douglas/"}' \
            > data/pages-health.json
          echo "ok=$OK" >> "$GITHUB_OUTPUT"

      - name: Commit verification report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'investbet-health-bot'
          git config user.email 'investbet-health-bot@users.noreply.github.com'
          git add data/pages-health.json
          git commit -m 'test: record public InvestBet dashboard health' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail if public dashboard is stale
        if: steps.verify.outputs.ok != '1'
        run: exit 1
