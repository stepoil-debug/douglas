name: Verify corrected checkin preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-checkin-preview.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify preview
        shell: bash
        run: |
          set +e
          BASE='https://step-event-checkin-jbwitotm9-douglas-6d4f.vercel.app'
          code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --max-time 30 "$BASE/")
          new_count=$(grep -Fo 'https://careers.step-og.com/' /tmp/page.html | wc -l)
          old_count=$(grep -Fo 'https://stepoil-debug.github.io/portal-talentos-step/' /tmp/page.html | wc -l)
          api_code=$(curl -L -sS -o /tmp/api.json -w '%{http_code}' --max-time 30 "$BASE/api/checkin")
          {
            echo "PAGE_HTTP=$code"
            echo "NEW_LINK_COUNT=$new_count"
            echo "OLD_LINK_COUNT=$old_count"
            echo "API_HTTP=$api_code"
            echo '--- API BODY ---'
            cat /tmp/api.json
            echo
            echo '--- PAGE HEAD ---'
            head -c 1000 /tmp/page.html
          } > checkin-preview-status.txt
          cat checkin-preview-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkin-preview-status.txt
          git commit -m 'chore: record corrected checkin preview diagnostics'
          git push
