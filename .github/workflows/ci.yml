name: InvestBet Football - CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/football_quant/**'
      - 'dashboard/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/analyze-football.yml'
      - '.github/workflows/settle-football.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile football engine
        run: python -m compileall -q src/football_quant

      - name: Accuracy quality guard smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.football_quant.quality_guard import apply_quality_guard

          recent = {
              'sample': 10,
              'over_1_5_rate': .90,
              'over_2_5_rate': .70,
              'under_2_5_rate': .30,
              'under_3_5_rate': .80,
              'under_4_5_rate': .90,
              'five_plus_rate': .10,
          }

          def base(selection, op, line, p, score, books=9):
              return {
                  'fixture_id': 1,
                  'kickoff_iso': '2026-08-25T10:00:00-03:00',
                  'market': 'Total de gols',
                  'market_family': 'GOALS',
                  'selection': selection,
                  'settlement_metric': 'goals',
                  'settlement_scope': 'match',
                  'settlement_operator': op,
                  'settlement_line': line,
                  'model_probability': p,
                  'score': score,
                  'bookmaker_count': books,
                  'signal_source': 'MULTI_MARKET_CONSENSUS',
                  'risk_flags': [],
              }

          safe = base('Mais de 1.5 gols', 'over', 1.5, .86, 86)
          risky_under = base('Menos de 4.5 gols', 'under', 4.5, .81, 82)
          asian_integer = base('Menos de 3 gols', 'under', 3.0, .90, 90)
          accepted, rejected = apply_quality_guard([safe, risky_under, asian_integer], recent, {})
          assert len(accepted) == 1 and accepted[0]['selection'] == 'Mais de 1.5 gols', (accepted, rejected)
          assert any('non_half_line_rejected' in (r.get('quality_guard') or {}).get('reasons', []) for r in rejected)
          assert any(r.get('selection') == 'Menos de 4.5 gols' for r in rejected)
          print('quality guard accepts robust line and rejects observed failure modes')
          PY

      - name: Betano portfolio accuracy, exclusivity, spacing and freeze test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from datetime import datetime
          from src.football_quant.betano_execution import (
              build_betano_tickets,
              _portfolio_has_unique_fixtures,
              _portfolio_has_required_spacing,
          )

          def leg(fid, hour, odd, probability, score, family='GOALS', op='over'):
              market = 'Total de gols' if family == 'GOALS' else 'Escanteios'
              metric = 'goals' if family == 'GOALS' else 'corner_kicks'
              line = 1.5 if family == 'GOALS' else 7.5
              return {
                  'fixture_id': fid,
                  'kickoff_iso': f'2026-08-25T{hour:02d}:00:00-03:00',
                  'market': market,
                  'market_family': family,
                  'selection': f'{"Mais" if op == "over" else "Menos"} de {line}',
                  'settlement_metric': metric,
                  'settlement_scope': 'match',
                  'settlement_operator': op,
                  'settlement_line': line,
                  'odd': odd,
                  'model_probability': probability,
                  'score': score,
                  'quality_score': score,
                  'bookmaker_count': 9,
                  'signal_source': 'MULTI_MARKET_CONSENSUS',
                  'bookmaker_quotes': {'Betano': odd, 'Book A': odd, 'Book B': odd},
                  'quality_guard': {'accepted': True},
              }

          payload = {'all_matches': []}
          rows = [
              (1, 8, 1.24, .86, 88, 'GOALS'), (2, 10, 1.28, .85, 87, 'CORNERS'),
              (3, 12, 1.25, .84, 86, 'GOALS'), (4, 14, 1.29, .84, 86, 'CORNERS'),
              (5, 16, 1.26, .83, 85, 'GOALS'), (6, 18, 1.30, .83, 85, 'CORNERS'),
              (7, 20, 1.27, .82, 84, 'GOALS'), (8, 22, 1.31, .82, 84, 'CORNERS'),
          ]
          for row in rows:
              payload['all_matches'].append({'eligible_legs': [leg(*row)]})

          tickets = build_betano_tickets(payload)
          assert len(tickets) == 3, tickets
          assert _portfolio_has_unique_fixtures(tickets), tickets
          assert _portfolio_has_required_spacing(tickets), tickets
          assert all(float(t['estimated_probability']) >= .68 for t in tickets), tickets
          ids = [l['fixture_id'] for t in tickets for l in t['legs']]
          assert len(ids) == len(set(ids)), tickets
          times = sorted(datetime.fromisoformat(l['kickoff_iso']).timestamp() for t in tickets for l in t['legs'])
          assert all((b - a) >= 7200 for a, b in zip(times, times[1:])), tickets

          frozen_b1 = tickets[0]
          payload['previous_published_tickets'] = [frozen_b1]
          rebuilt = build_betano_tickets(payload)
          assert rebuilt[0] == frozen_b1, (frozen_b1, rebuilt[0])
          print('accuracy-first portfolio + immutable partial publication OK')
          PY

      - name: Multi-market generation smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.football_quant.multi_market import build_multi_market_legs, family_counts

          fixture = {
              'fixture': {'id': 500, 'date': '2026-08-25T20:00:00-03:00'},
              'teams': {'home': {'name': 'Time A'}, 'away': {'name': 'Time B'}},
              'league': {'name': 'Liga Teste', 'country': 'Brazil'},
          }
          odds = {
              'fixture': {'id': 500},
              'bookmakers': [
                  {'name': 'Betano', 'bets': [
                      {'name': 'Corners Over/Under', 'values': [{'value': 'Over 7.5', 'odd': '1.28'}]},
                      {'name': 'Yellow Cards Over/Under', 'values': [{'value': 'Over 2.5', 'odd': '1.30'}]},
                      {'name': 'Shots on Target Over/Under', 'values': [{'value': 'Over 5.5', 'odd': '1.27'}]},
                  ]},
                  {'name': 'Book A', 'bets': [
                      {'name': 'Corners Over/Under', 'values': [{'value': 'Over 7.5', 'odd': '1.27'}]},
                      {'name': 'Yellow Cards Over/Under', 'values': [{'value': 'Over 2.5', 'odd': '1.29'}]},
                      {'name': 'Shots on Target Over/Under', 'values': [{'value': 'Over 5.5', 'odd': '1.26'}]},
                  ]},
                  {'name': 'Book B', 'bets': [
                      {'name': 'Corners Over/Under', 'values': [{'value': 'Over 7.5', 'odd': '1.29'}]},
                      {'name': 'Yellow Cards Over/Under', 'values': [{'value': 'Over 2.5', 'odd': '1.31'}]},
                      {'name': 'Shots on Target Over/Under', 'values': [{'value': 'Over 5.5', 'odd': '1.28'}]},
                  ]},
              ],
          }
          legs = build_multi_market_legs(fixture, odds)
          counts = family_counts(legs)
          assert counts['CORNERS'] >= 1, legs
          assert counts['CARDS'] >= 1, legs
          assert counts['SHOTS'] >= 1, legs
          print('multi-market generation OK', counts)
          PY

      - name: GREEN RED verifier smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.football_quant.settlement import settle_leg, settle_ticket

          fixture = {
              'fixture': {'id': 99, 'status': {'short': 'FT'}},
              'score': {'fulltime': {'home': 1, 'away': 2}},
              'goals': {'home': 1, 'away': 2},
          }
          green = {
              'fixture_id': 99,
              'home_team': 'Time Azul',
              'away_team': 'Time Branco',
              'market': 'Dupla chance',
              'selection': 'Time Branco ou empate',
          }
          red = {
              'fixture_id': 99,
              'home_team': 'Time Azul',
              'away_team': 'Time Branco',
              'market': 'Dupla chance',
              'selection': 'Time Azul ou empate',
          }
          assert settle_leg(green, fixture)['status'] == 'GREEN'
          assert settle_leg(red, fixture)['status'] == 'RED'
          assert settle_ticket({'legs': [green, red]}, {99: fixture})['status'] == 'RED'
          print('GREEN/RED verifier OK')
          PY
