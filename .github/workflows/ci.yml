name: InvestBet Football - CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/football_quant/**'
      - 'dashboard/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/analyze-football.yml'
      - '.github/workflows/settle-football.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile football engine
        run: python -m compileall -q src/football_quant
      - name: Same-day ticket builder smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.football_quant.ticket_builder import build_tickets, pct
          assert pct('60%') == 0.6
          def leg(fid, market, selection, price, probability, score):
              return {
                  'fixture_id': fid,
                  'market': market,
                  'selection': selection,
                  'odd': price,
                  'model_probability': probability,
                  'score': score,
                  'signal_source': 'MODEL+MARKET',
                  'bookmaker_quotes': {'Book A': price, 'Book B': round(price - 0.01, 2)},
              }
          legs = [
              leg(1,'Dupla chance','A ou empate',1.28,0.82,82),
              leg(2,'Total de gols','Mais de 1.5',1.30,0.81,81),
              leg(3,'Dupla chance','C ou empate',1.31,0.80,80),
              leg(4,'Total de gols','Menos de 4.5',1.27,0.84,84),
              leg(5,'Vencedor','E',1.72,0.64,74),
          ]
          tickets = build_tickets(legs, target=3)
          assert len(tickets) == 3, tickets
          assert all(1.50 <= t['total_odd'] <= 2.00 for t in tickets)
          assert all(1 <= len(t['legs']) <= 2 for t in tickets)
          assert all(len({leg['bookmaker'] for leg in t['legs']}) == 1 for t in tickets)
          fixture_ids = [leg['fixture_id'] for ticket in tickets for leg in ticket['legs']]
          assert len(fixture_ids) == len(set(fixture_ids)), tickets
          print('3 executable tickets with exclusive fixtures OK')
          PY
      - name: Betano portfolio fixture exclusivity and 2h spacing test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from datetime import datetime
          from src.football_quant.betano_execution import (
              build_betano_tickets,
              _portfolio_has_unique_fixtures,
              _portfolio_has_required_spacing,
          )

          def leg(fid, hour, odd, probability, score, selection):
              return {
                  'fixture_id': fid,
                  'kickoff_iso': f'2026-08-25T{hour:02d}:00:00-03:00',
                  'market': 'Dupla chance',
                  'selection': selection,
                  'odd': odd,
                  'model_probability': probability,
                  'score': score,
                  'signal_source': 'MODEL+MARKET',
                  'bookmaker_quotes': {'Betano': odd, 'Book A': odd},
              }

          payload = {'all_matches': []}
          for fid, hour, odd, probability, score in [
              (1, 8, 1.24, .86, 88), (2, 10, 1.28, .84, 86),
              (3, 12, 1.25, .83, 85), (4, 14, 1.29, .82, 84),
              (5, 16, 1.26, .81, 83), (6, 18, 1.30, .80, 82),
              (7, 20, 1.27, .79, 81), (8, 22, 1.31, .78, 80),
          ]:
              payload['all_matches'].append({
                  'eligible_legs': [leg(fid, hour, odd, probability, score, f'Time {fid} ou empate')]
              })

          tickets = build_betano_tickets(payload)
          assert len(tickets) == 3, tickets
          assert _portfolio_has_unique_fixtures(tickets), tickets
          assert _portfolio_has_required_spacing(tickets), tickets
          ids = [leg['fixture_id'] for ticket in tickets for leg in ticket['legs']]
          assert len(ids) == len(set(ids)), tickets
          times = sorted(datetime.fromisoformat(leg['kickoff_iso']).timestamp() for ticket in tickets for leg in ticket['legs'])
          assert all((b - a) >= 7200 for a, b in zip(times, times[1:])), tickets

          close_payload = {'all_matches': [
              {'eligible_legs': [leg(20, 12, 1.24, .86, 88, 'A')]},
              {'eligible_legs': [dict(leg(21, 13, 1.28, .84, 86, 'B'), kickoff_iso='2026-08-25T13:00:00-03:00')]},
          ]}
          close_tickets = build_betano_tickets(close_payload)
          assert all(len(t['legs']) == 1 for t in close_tickets), close_tickets
          print('Betano portfolio exclusivity + minimum 2h kickoff spacing OK')
          PY
      - name: Multi-market generation smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.football_quant.multi_market import build_multi_market_legs, family_counts

          fixture = {
              'fixture': {'id': 500, 'date': '2026-08-19T20:00:00-03:00'},
              'teams': {'home': {'name': 'Time A'}, 'away': {'name': 'Time B'}},
              'league': {'name': 'Liga Teste', 'country': 'Brazil'},
          }
          odds = {
              'fixture': {'id': 500},
              'bookmakers': [
                  {'name': 'Betano', 'bets': [
                      {'name': 'Corners Over/Under', 'values': [{'value': 'Over 7.5', 'odd': '1.28'}]},
                      {'name': 'Yellow Cards Over/Under', 'values': [{'value': 'Over 2.5', 'odd': '1.30'}]},
                      {'name': 'Shots on Target Over/Under', 'values': [{'value': 'Over 5.5', 'odd': '1.27'}]},
                  ]},
                  {'name': 'Book A', 'bets': [
                      {'name': 'Corners Over/Under', 'values': [{'value': 'Over 7.5', 'odd': '1.27'}]},
                      {'name': 'Yellow Cards Over/Under', 'values': [{'value': 'Over 2.5', 'odd': '1.29'}]},
                      {'name': 'Shots on Target Over/Under', 'values': [{'value': 'Over 5.5', 'odd': '1.26'}]},
                  ]},
                  {'name': 'Book B', 'bets': [
                      {'name': 'Corners Over/Under', 'values': [{'value': 'Over 7.5', 'odd': '1.29'}]},
                      {'name': 'Yellow Cards Over/Under', 'values': [{'value': 'Over 2.5', 'odd': '1.31'}]},
                      {'name': 'Shots on Target Over/Under', 'values': [{'value': 'Over 5.5', 'odd': '1.28'}]},
                  ]},
              ],
          }
          legs = build_multi_market_legs(fixture, odds)
          counts = family_counts(legs)
          assert counts['CORNERS'] >= 1, legs
          assert counts['CARDS'] >= 1, legs
          assert counts['SHOTS'] >= 1, legs
          assert all(leg.get('settlement_metric') for leg in legs)
          print('corners/cards/shots generation OK', counts)
          PY
      - name: GREEN RED verifier smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.football_quant.settlement import settle_leg, settle_ticket

          fixture = {
              'fixture': {'id': 99, 'status': {'short': 'FT'}},
              'score': {'fulltime': {'home': 1, 'away': 2}},
              'goals': {'home': 1, 'away': 2},
          }
          green = {
              'fixture_id': 99,
              'home_team': 'Time A',
              'away_team': 'Time B',
              'market': 'Dupla chance',
              'selection': 'Time B ou empate',
          }
          red = {
              'fixture_id': 99,
              'home_team': 'Time A',
              'away_team': 'Time B',
              'market': 'Dupla chance',
              'selection': 'Time A ou empate',
          }
          over = {
              'fixture_id': 99,
              'home_team': 'Time A',
              'away_team': 'Time B',
              'market': 'Total de gols',
              'selection': 'Mais de 1.5 gols',
          }
          stats = {
              'home': {'corner_kicks': 5, 'yellow_cards': 2, 'shots_on_goal': 4, 'total_shots': 11},
              'away': {'corner_kicks': 4, 'yellow_cards': 3, 'shots_on_goal': 3, 'total_shots': 9},
          }
          corners = {
              'fixture_id': 99, 'home_team': 'Time A', 'away_team': 'Time B',
              'market': 'Escanteios', 'selection': 'Mais de 7.5 escanteios',
              'settlement_metric': 'corner_kicks', 'settlement_scope': 'match',
              'settlement_operator': 'over', 'settlement_line': 7.5,
          }
          cards = {
              'fixture_id': 99, 'home_team': 'Time A', 'away_team': 'Time B',
              'market': 'Cartões amarelos', 'selection': 'Mais de 2.5 cartões amarelos',
              'settlement_metric': 'yellow_cards', 'settlement_scope': 'match',
              'settlement_operator': 'over', 'settlement_line': 2.5,
          }
          shots = {
              'fixture_id': 99, 'home_team': 'Time A', 'away_team': 'Time B',
              'market': 'Chutes no alvo', 'selection': 'Mais de 5.5 chutes no alvo',
              'settlement_metric': 'shots_on_goal', 'settlement_scope': 'match',
              'settlement_operator': 'over', 'settlement_line': 5.5,
          }
          assert settle_leg(green, fixture)['status'] == 'GREEN'
          assert settle_leg(red, fixture)['status'] == 'RED'
          assert settle_leg(over, fixture)['status'] == 'GREEN'
          assert settle_leg(corners, fixture, stats)['status'] == 'GREEN'
          assert settle_leg(cards, fixture, stats)['status'] == 'GREEN'
          assert settle_leg(shots, fixture, stats)['status'] == 'GREEN'
          ticket = {'legs': [green, red], 'status': 'PENDING'}
          assert settle_ticket(ticket, {99: fixture})['status'] == 'RED'
          print('GREEN RED verifier including multi-market stats OK')
          PY
