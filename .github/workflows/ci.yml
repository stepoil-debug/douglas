name: Tennis Quant - CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
      - '.github/workflows/analyze.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install requests beautifulsoup4 pytest
      - name: Compile source and collectors
        run: python -m compileall -q src scripts
      - name: Unit tests
        env:
          PYTHONPATH: src:.
        run: pytest -q
