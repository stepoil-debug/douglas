name: InvestBet Football - CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/football_quant/**'
      - 'dashboard/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/analyze-football.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile football engine
        run: python -m compileall -q src/football_quant
      - name: Football engine smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.football_quant.analyzer import pct, rank_analyses
          assert pct('60%') == 0.6
          approved, rejected = rank_analyses([
              {'decision':'APPROVED','score':82,'edge':0.08,'odd':1.70},
              {'decision':'REJECTED','score':55,'probability':0.52}
          ])
          assert len(approved) == 1 and approved[0]['rank'] == 1
          assert len(rejected) == 1
          print('Football engine OK')
          PY
