name: Restore selected InvestBet board

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-selected-board.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch 2026-08-19 board analysis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --output /tmp/response.txt --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            'https://api.github.com/repos/stepoil-debug/douglas/actions/workflows/analyze-football.yml/dispatches' \
            --data '{"ref":"main","inputs":{"date":"2026-08-19"}}')"
          if [ "$HTTP_CODE" != '204' ] && [ "$HTTP_CODE" != '200' ]; then
            cat /tmp/response.txt || true
            exit 1
          fi
          echo '2026-08-19 analysis dispatched.'
