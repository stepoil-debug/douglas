name: InvestBet Manual Trigger Poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-trigger-poller.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: investbet-manual-trigger-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Claim pending dashboard request
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            'https://intranet-stepone.netlify.app/api/investbet/analysis-trigger?action=claim')"
          echo "$RESPONSE"
          CLAIMED="$(printf '%s' "$RESPONSE" | jq -r '.claimed // false')"
          REQUEST_ID="$(printf '%s' "$RESPONSE" | jq -r '.state.request_id // ""')"
          echo "claimed=$CLAIMED" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Dispatch football analysis
        if: steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --output /tmp/dispatch-response.txt --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/analyze-football.yml/dispatches" \
            --data '{"ref":"main"}')"
          if [ "$HTTP_CODE" != '200' ] && [ "$HTTP_CODE" != '204' ]; then
            cat /tmp/dispatch-response.txt || true
            echo "Workflow dispatch failed with HTTP $HTTP_CODE" >&2
            exit 1
          fi
          echo 'InvestBet Football - Analyze dispatched successfully.'

      - name: Mark request dispatched
        if: steps.claim.outputs.claimed == 'true' && success()
        env:
          REQUEST_ID: ${{ steps.claim.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"request_id\":\"${REQUEST_ID}\",\"success\":true}" \
            'https://intranet-stepone.netlify.app/api/investbet/analysis-trigger?action=finish' >/dev/null

      - name: Release request after dispatch failure
        if: failure() && steps.claim.outputs.claimed == 'true'
        env:
          REQUEST_ID: ${{ steps.claim.outputs.request_id }}
        shell: bash
        run: |
          curl --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"request_id\":\"${REQUEST_ID}\"}" \
            'https://intranet-stepone.netlify.app/api/investbet/analysis-trigger?action=release' >/dev/null || true
