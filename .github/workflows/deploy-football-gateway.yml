name: Deploy InvestBet Football API Gateway

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/deploy-football-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investbet-football-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_SITE_ID: 820f2232-fd62-486e-86be-fe589015cc40
      NETLIFY_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_TOKEN_ALTERNATE: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Netlify credential
        shell: bash
        run: |
          set -euo pipefail
          token="${NETLIFY_TOKEN_PRIMARY:-}"
          [ -n "$token" ] || token="${NETLIFY_TOKEN_FALLBACK:-}"
          [ -n "$token" ] || token="${NETLIFY_TOKEN_ALTERNATE:-}"
          if [ -z "$token" ]; then
            echo 'NETLIFY_AUTH_TOKEN/NETLIFY_TOKEN/NETLIFY_ACCESS_TOKEN not configured for this repository.'
            exit 1
          fi
          echo "NETLIFY_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy gateway to Netlify
        working-directory: gateway
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --dir public \
            --functions netlify/functions \
            --message "InvestBet Football API Gateway"

      - name: Verify gateway route
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/gateway.json -w '%{http_code}' 'https://investbet-football-api.netlify.app/api/football-board?date=2026-08-18')
          cat /tmp/gateway.json
          test "$code" = "200"
