name: Capture live checkin HTML

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-checkin-live.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        run: |
          curl -L -sS --fail --max-time 30 https://checkin.step-og.com/ -o checkin-live.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkin-live.html
          git commit -m 'chore: capture live checkin html'
          git push
