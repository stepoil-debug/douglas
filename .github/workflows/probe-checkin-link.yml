name: Probe STEP checkin link

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-checkin-link.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live checkin
        shell: bash
        run: |
          set -euo pipefail
          URL='https://checkin.step-og.com/'
          mkdir -p /tmp/checkin-probe
          curl -L -sS --max-time 30 -D /tmp/checkin-probe/headers.txt -o /tmp/checkin-probe/index.html "$URL"

          {
            echo "PROBE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "URL=$URL"
            echo "--- RESPONSE HEADERS ---"
            cat /tmp/checkin-probe/headers.txt
            echo
            echo "--- OLD/NEW LINK MATCHES IN HTML ---"
            grep -Ein 'portal-talentos-step|careers\.step-og\.com|trabalhe.{0,30}conosco' /tmp/checkin-probe/index.html || true
            echo
            echo "--- HREFS ---"
            grep -Eo 'href=["'"'][^"'"']+["'"']' /tmp/checkin-probe/index.html | head -100 || true
            echo
            echo "--- SCRIPT SOURCES ---"
            grep -Eo 'src=["'"'][^"'"']+\.js[^"'"']*["'"']' /tmp/checkin-probe/index.html | head -100 || true
          } > checkin-live-probe.txt

          python3 - <<'PY'
          import re, pathlib, urllib.parse, urllib.request
          base='https://checkin.step-og.com/'
          html=pathlib.Path('/tmp/checkin-probe/index.html').read_text(errors='ignore')
          assets=[]
          for m in re.finditer(r'(?:src|href)=["\']([^"\']+)["\']', html, re.I):
              u=m.group(1)
              if '.js' in u or '.css' in u:
                  assets.append(urllib.parse.urljoin(base,u))
          seen=[]
          for u in assets:
              if u not in seen: seen.append(u)
          with open('checkin-live-probe.txt','a',encoding='utf-8') as out:
              out.write('\n--- ASSET MATCHES ---\n')
              for u in seen[:30]:
                  try:
                      data=urllib.request.urlopen(u, timeout=20).read().decode('utf-8','ignore')
                  except Exception as e:
                      out.write(f'FETCH_ERROR {u}: {e}\n')
                      continue
                  hits=[]
                  for pat in ['portal-talentos-step','careers.step-og.com','Trabalhe Conosco','trabalhe conosco']:
                      if pat.lower() in data.lower(): hits.append(pat)
                  if hits:
                      out.write(f'MATCH {u} => {hits}\n')
                      low=data.lower()
                      for needle in ['portal-talentos-step','careers.step-og.com','trabalhe conosco']:
                          i=low.find(needle.lower())
                          if i>=0:
                              out.write(data[max(0,i-500):min(len(data),i+1000)].replace('\n',' ')+'\n')
              out.write('\n--- HTML SHA256 ---\n')
              import hashlib
              out.write(hashlib.sha256(html.encode()).hexdigest()+'\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkin-live-probe.txt
          git commit -m 'chore: capture live checkin link probe' || exit 0
          git push
