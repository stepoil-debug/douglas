name: Probe STEP checkin link

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-checkin-link.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live checkin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, hashlib, datetime
          base='https://checkin.step-og.com/'
          req=urllib.request.Request(base, headers={'User-Agent':'Mozilla/5.0 STEP-Link-Probe'})
          with urllib.request.urlopen(req, timeout=30) as r:
              html=r.read().decode('utf-8','ignore')
              final_url=r.geturl()
              status=getattr(r,'status',None)
              headers=dict(r.headers.items())
          lines=[]
          lines.append('PROBE_UTC='+datetime.datetime.now(datetime.timezone.utc).isoformat())
          lines.append('URL='+base)
          lines.append('FINAL_URL='+str(final_url))
          lines.append('STATUS='+str(status))
          lines.append('--- RESPONSE HEADERS ---')
          for k,v in headers.items(): lines.append(f'{k}: {v}')
          lines.append('--- HTML LINK MATCHES ---')
          low=html.lower()
          for needle in ['portal-talentos-step','careers.step-og.com','trabalhe conosco']:
              start=0
              while True:
                  i=low.find(needle, start)
                  if i < 0: break
                  lines.append(html[max(0,i-400):min(len(html),i+900)].replace('\n',' '))
                  start=i+len(needle)
          attrs=[]
          for m in re.finditer(r'(?:src|href)=["\']([^"\']+)["\']', html, re.I):
              attrs.append(m.group(1))
          lines.append('--- HTML ASSET/LINK URLS ---')
          for u in list(dict.fromkeys(attrs))[:150]: lines.append(u)
          assets=[]
          for u in attrs:
              if '.js' in u or '.css' in u:
                  full=urllib.parse.urljoin(base,u)
                  if full not in assets: assets.append(full)
          lines.append('--- ASSET MATCHES ---')
          for u in assets[:50]:
              try:
                  areq=urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0 STEP-Link-Probe'})
                  with urllib.request.urlopen(areq, timeout=20) as ar:
                      data=ar.read().decode('utf-8','ignore')
              except Exception as e:
                  lines.append(f'FETCH_ERROR {u}: {e}')
                  continue
              alow=data.lower()
              found=False
              for needle in ['portal-talentos-step','careers.step-og.com','trabalhe conosco']:
                  i=alow.find(needle)
                  if i >= 0:
                      if not found:
                          lines.append('MATCH_ASSET='+u)
                          found=True
                      lines.append(data[max(0,i-500):min(len(data),i+1200)].replace('\n',' '))
          lines.append('HTML_SHA256='+hashlib.sha256(html.encode()).hexdigest())
          open('checkin-live-probe.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkin-live-probe.txt
          git commit -m 'chore: capture live checkin link probe' || exit 0
          git push
