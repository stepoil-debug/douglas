name: Sync frozen sequence schedules

on:
  workflow_run:
    workflows: ["Tennis Quant - Analyze"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sequence-sync.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Analysis and schedule sync both update generated data on main. Sharing the same
  # writer lock prevents non-fast-forward push failures during a manual refresh.
  group: investbet-tennis-data-writer
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh current dates and times without changing picks
        env:
          PYTHONPATH: src:.
        run: |
          OPERATIONAL_DATE="$(TZ=America/Sao_Paulo date +%F)"
          python scripts/refresh_sequence_times.py --date "$OPERATIONAL_DATE" --days 2

      - name: Commit schedule metadata only
        run: |
          git config user.name "tennis-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sequences
          if git diff --cached --quiet; then
            echo "No sequence schedule changes"
            exit 0
          fi
          git commit -m "data: sync frozen sequence schedules"
          git push

  deploy-pages:
    needs: sync
    if: ${{ needs.sync.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout latest synchronized data
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Stage InvestBet dashboard with frozen sequences
        run: |
          mkdir -p dashboard/history dashboard/learning dashboard/sequences
          if compgen -G "data/history/*.json" > /dev/null; then
            cp data/history/*.json dashboard/history/
          fi
          if compgen -G "data/learning/????-??-??.json" > /dev/null; then
            cp data/learning/????-??-??.json dashboard/learning/
          fi
          if compgen -G "data/sequences/????-??-??.json" > /dev/null; then
            cp data/sequences/????-??-??.json dashboard/sequences/
          fi
          cp dashboard/v2.html dashboard/index.html
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          index_path = Path('dashboard/index.html')
          html = index_path.read_text(encoding='utf-8')
          trigger = '<script src="manual-trigger.js"></script>'
          if trigger not in html:
              html = html.replace('</body>', f'{trigger}</body>')
              index_path.write_text(html, encoding='utf-8')

          history_dates = []
          for path in sorted(Path('data/history').glob('????-??-??.json'), reverse=True):
              try:
                  row = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              history_dates.append({
                  'date': row.get('date', path.stem),
                  'updated_at': row.get('updated_at'),
                  'summary': row.get('summary', {}),
              })
          Path('dashboard/history/index.json').write_text(
              json.dumps({'updated_at': datetime.now(timezone.utc).isoformat(), 'dates': history_dates}, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )

          sequences = []
          for path in sorted(Path('data/sequences').glob('????-??-??.json'), reverse=True):
              try:
                  row = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              sequences.append({
                  'date': row.get('date', path.stem),
                  'created_at': row.get('created_at'),
                  'updated_at': row.get('updated_at'),
                  'summary': row.get('summary', {}),
              })
          Path('dashboard/sequences/index.json').write_text(
              json.dumps({'updated_at': datetime.now(timezone.utc).isoformat(), 'dates': sequences}, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
      - name: Deploy synchronized sequence dashboard
        id: deployment
        uses: actions/deploy-pages@v4
