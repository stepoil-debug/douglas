name: Sync frozen sequence schedules

on:
  workflow_run:
    workflows: ["Tennis Quant - Analyze"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investbet-sequence-schedule-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh current dates and times without changing picks
        env:
          PYTHONPATH: src:.
        run: |
          OPERATIONAL_DATE="$(TZ=America/Sao_Paulo date +%F)"
          python scripts/refresh_sequence_times.py --date "$OPERATIONAL_DATE" --days 2

      - name: Commit schedule metadata only
        run: |
          git config user.name "tennis-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sequences
          if git diff --cached --quiet; then
            echo "No sequence schedule changes"
            exit 0
          fi
          git commit -m "data: sync frozen sequence schedules"
          git push
