name: Probe Casa de Apostas Share Link

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_casadeapostas.mjs'
      - 'scripts/probe_cda_slip_controls.mjs'
      - '.github/workflows/probe-casadeapostas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe filled slip
        run: node scripts/probe_casadeapostas.mjs
      - name: Map filled-slip controls
        run: node scripts/probe_cda_slip_controls.mjs
      - name: Persist probe summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          [ -f artifacts/cda-probe/summary.json ] && cp artifacts/cda-probe/summary.json data/cda_probe.json || printf '{"ok":false,"message":"probe did not produce summary.json"}\n' > data/cda_probe.json
          [ -f artifacts/cda-probe/event_odds_candidates.json ] && cp artifacts/cda-probe/event_odds_candidates.json data/cda_probe_odds.json || true
          [ -f artifacts/cda-probe/share_candidates.json ] && cp artifacts/cda-probe/share_candidates.json data/cda_probe_share.json || true
          [ -f artifacts/cda-probe/around_bet_button.json ] && cp artifacts/cda-probe/around_bet_button.json data/cda_probe_betslip_controls.json || true
          [ -f artifacts/cda-probe/controls_summary.json ] && cp artifacts/cda-probe/controls_summary.json data/cda_controls_summary.json || true
          [ -f artifacts/cda-probe/slip_controls_full.json ] && cp artifacts/cda-probe/slip_controls_full.json data/cda_slip_controls.json || true
          git config user.name 'investbet-probe-bot'
          git config user.email 'investbet-probe-bot@users.noreply.github.com'
          git add data/cda_*.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'test: update Casa de Apostas probe evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa-de-apostas-probe
          path: artifacts/cda-probe
          if-no-files-found: warn
          retention-days: 3
