name: Probe STEP checkin origin

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-checkin-origin.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe origin metadata
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          dig +short checkin.step-og.com CNAME
          dig +short checkin.step-og.com A
          echo '=== CANDIDATE FILES ==='
          for p in '/.vercel/project.json' '/vercel.json' '/package.json' '/index.html' '/api/entries'; do
            echo "--- $p ---"
            curl -L -sS --max-time 15 -w '\nHTTP=%{http_code} FINAL=%{url_effective}\n' "https://checkin.step-og.com$p" | head -c 5000
            echo
          done
