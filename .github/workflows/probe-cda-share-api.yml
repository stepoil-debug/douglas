name: Probe Casa Sharebets API

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_cda_share_api.mjs'
      - '.github/workflows/probe-cda-share-api.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect sharebets API
        run: node scripts/probe_cda_share_api.mjs
      - name: Persist API evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          [ -f artifacts/cda-share-api/summary.json ] && cp artifacts/cda-share-api/summary.json data/cda_share_api_summary.json || printf '{"ok":false,"message":"missing summary"}\n' > data/cda_share_api_summary.json
          [ -f artifacts/cda-share-api/full.json ] && cp artifacts/cda-share-api/full.json data/cda_share_api_full.json || true
          git config user.name 'investbet-probe-bot'
          git config user.email 'investbet-probe-bot@users.noreply.github.com'
          git add data/cda_share_api_*.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'test: update Casa sharebets API evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
