name: InvestBet Football - Analyze

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Data do board (YYYY-MM-DD). Vazio = hoje em America/Sao_Paulo'
        required: false
        type: string
  schedule:
    # 07:05, 11:05, 15:05 e 19:05 no horario de Brasilia (UTC-3).
    # Quatro varreduras por dia mantem o board atualizado sem estourar o plano gratuito.
    - cron: '5 10,14,18,22 * * *'
  push:
    branches: [main]
    paths:
      - 'src/football_quant/**'
      - '.github/workflows/analyze-football.yml'

permissions:
  contents: write

concurrency:
  group: investbet-football-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY_PRIMARY: ${{ secrets.API_FOOTBALL_KEY }}
      KEY_ALIAS_1: ${{ secrets.API_SPORTS_KEY }}
      KEY_ALIAS_2: ${{ secrets.FOOTBALL_API_KEY }}
      KEY_ALIAS_3: ${{ secrets.APISPORTS_KEY }}
      FOOTBALL_MAX_CANDIDATES: '14'
      FOOTBALL_MAX_ODDS_PAGES: '6'
      API_FOOTBALL_MIN_INTERVAL: '6.2'
      INPUT_DATE: ${{ github.event.inputs.date || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve API-Football secret without exposing it
        shell: bash
        run: |
          set -euo pipefail
          key="${KEY_PRIMARY:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_1:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_2:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_3:-}"
          if [ -n "$key" ]; then
            echo '::add-mask::'$key
            echo "API_FOOTBALL_KEY=$key" >> "$GITHUB_ENV"
            echo 'API-Football credential resolved.'
          else
            echo 'No compatible API-Football secret was found.'
          fi

      - name: Analyze today's football slate
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            python -m src.football_quant.cli --date "$INPUT_DATE"
          else
            python -m src.football_quant.cli
          fi

      - name: Persist dashboard data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'investbet-football-bot'
          git config user.email 'investbet-football-bot@users.noreply.github.com'
          git add dashboard/data.json dashboard/run_status.json data/football/history || true
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m 'data: update same-day football tickets'
          git pull --rebase origin main
          git push origin HEAD:main
