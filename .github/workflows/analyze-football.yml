name: InvestBet Football - Analyze

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Data do board (YYYY-MM-DD). Vazio = hoje em America/Sao_Paulo'
        required: false
        type: string
  schedule:
    - cron: '5 10,14,18,22 * * *'
  push:
    branches: [main]
    paths:
      - 'src/football_quant/**'
      - '.github/workflows/analyze-football.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: investbet-football-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEY_PRIMARY: ${{ secrets.API_FOOTBALL_KEY }}
      KEY_ALIAS_1: ${{ secrets.API_SPORTS_KEY }}
      KEY_ALIAS_2: ${{ secrets.FOOTBALL_API_KEY }}
      KEY_ALIAS_3: ${{ secrets.APISPORTS_KEY }}
      KEY_ALIAS_4: ${{ secrets.EFOOTBAL }}
      FOOTBALL_MAX_CANDIDATES: '24'
      FOOTBALL_MAX_ODDS_PAGES: '8'
      API_FOOTBALL_MIN_INTERVAL: '6.2'
      INPUT_DATE: ${{ github.event.inputs.date || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Protect a manually selected future board
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Sao_Paulo date +%F)"
          CURRENT_DATE="$(jq -r '.board_date // empty' dashboard/run_status.json 2>/dev/null || true)"
          echo "Scheduled refresh: today=${TODAY}, current_board=${CURRENT_DATE:-none}"
          if [ -n "$CURRENT_DATE" ] && [[ "$CURRENT_DATE" > "$TODAY" ]]; then
            echo 'A future board was selected manually. Scheduled refresh will not overwrite it.'
            echo 'SKIP_ANALYSIS=true' >> "$GITHUB_ENV"
          else
            echo 'SKIP_ANALYSIS=false' >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP_ANALYSIS != 'true'
        with:
          python-version: '3.12'

      - name: Resolve API-Football secret without exposing it
        if: env.SKIP_ANALYSIS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          key="${KEY_PRIMARY:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_1:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_2:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_3:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_4:-}"
          if [ -n "$key" ]; then
            echo '::add-mask::'$key
            echo "API_FOOTBALL_KEY=$key" >> "$GITHUB_ENV"
            echo 'API-Football credential resolved.'
          else
            echo 'No compatible API-Football secret was found.'
          fi

      - name: Analyze football slate
        if: env.SKIP_ANALYSIS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            echo "Analyzing selected board date: $INPUT_DATE"
            python -m src.football_quant.cli --date "$INPUT_DATE"
          else
            python -m src.football_quant.cli
          fi

      - name: Build execution-ready Betano tickets
        if: env.SKIP_ANALYSIS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m src.football_quant.betano_execution

      - name: Verify finished matches and rebuild simulated bankroll
        if: env.SKIP_ANALYSIS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m src.football_quant.settlement --max-dates 1

      - name: Refresh performance audit
        if: env.SKIP_ANALYSIS != 'true'
        run: python -m src.football_quant.performance_audit

      - name: Persist dashboard data
        if: env.SKIP_ANALYSIS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'investbet-football-bot'
          git config user.email 'investbet-football-bot@users.noreply.github.com'
          git add dashboard/data.json dashboard/run_status.json dashboard/management.json dashboard/performance_audit.json data/football/history data/football/performance_audit.json || true
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m 'data: update accuracy-first tickets, results and audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish dashboard explicitly
        if: env.SKIP_ANALYSIS != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --output /tmp/pages-dispatch.txt --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            --data '{"ref":"main"}')"
          if [ "$HTTP_CODE" != '204' ] && [ "$HTTP_CODE" != '200' ]; then
            cat /tmp/pages-dispatch.txt || true
            echo "Pages dispatch failed with HTTP ${HTTP_CODE}" >&2
            exit 1
          fi
          echo 'GitHub Pages deployment dispatched.'
