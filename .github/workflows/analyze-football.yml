name: InvestBet Football - Analyze

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Data do board (YYYY-MM-DD). Vazio = hoje em America/Sao_Paulo'
        required: false
        type: string
      request_id:
        description: 'ID interno da solicitação feita pelo painel'
        required: false
        type: string
  schedule:
    - cron: '5 10,14,18,22 * * *'
  push:
    branches: [main]
    paths:
      - 'src/football_quant/**'
      - '.github/workflows/analyze-football.yml'

permissions:
  contents: write

concurrency:
  group: investbet-football-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KEY_PRIMARY: ${{ secrets.API_FOOTBALL_KEY }}
      KEY_ALIAS_1: ${{ secrets.API_SPORTS_KEY }}
      KEY_ALIAS_2: ${{ secrets.FOOTBALL_API_KEY }}
      KEY_ALIAS_3: ${{ secrets.APISPORTS_KEY }}
      KEY_ALIAS_4: ${{ secrets.EFOOTBAL }}
      FOOTBALL_MAX_CANDIDATES: '14'
      FOOTBALL_MAX_ODDS_PAGES: '6'
      API_FOOTBALL_MIN_INTERVAL: '6.2'
      INPUT_DATE: ${{ github.event.inputs.date || '' }}
      REQUEST_ID: ${{ github.event.inputs.request_id || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve API-Football secret without exposing it
        shell: bash
        run: |
          set -euo pipefail
          key="${KEY_PRIMARY:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_1:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_2:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_3:-}"
          [ -n "$key" ] || key="${KEY_ALIAS_4:-}"
          if [ -n "$key" ]; then
            echo '::add-mask::'$key
            echo "API_FOOTBALL_KEY=$key" >> "$GITHUB_ENV"
            echo 'API-Football credential resolved.'
          else
            echo 'No compatible API-Football secret was found.'
          fi

      - name: Analyze football slate
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            echo "Analyzing selected board date: $INPUT_DATE"
            python -m src.football_quant.cli --date "$INPUT_DATE"
          else
            python -m src.football_quant.cli
          fi

      - name: Build execution-ready Betano tickets
        shell: bash
        run: |
          set -euo pipefail
          python -m src.football_quant.betano_execution

      - name: Verify finished matches and rebuild simulated bankroll
        shell: bash
        run: |
          set -euo pipefail
          python -m src.football_quant.settlement --max-dates 1

      - name: Persist dashboard data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'investbet-football-bot'
          git config user.email 'investbet-football-bot@users.noreply.github.com'
          git add dashboard/data.json dashboard/run_status.json dashboard/management.json data/football/history || true
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m 'data: update Betano tickets, results and bankroll'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report manual request completion
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.request_id != ''
        env:
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set +e
          SUCCESS=false
          ERROR='ANALYSIS_FAILED'
          if [ "$JOB_STATUS" = 'success' ]; then
            SUCCESS=true
            ERROR=''
          fi
          PAYLOAD="$(jq -nc --arg request_id "$REQUEST_ID" --argjson success "$SUCCESS" --arg error "$ERROR" '{request_id:$request_id,success:$success,error:$error}')"
          curl --silent --show-error --retry 3 --retry-delay 2 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD" \
            'https://intranet-stepone.netlify.app/api/investbet/analysis-trigger?action=complete' >/dev/null || true
