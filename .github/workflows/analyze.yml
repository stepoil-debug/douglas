name: Tennis Quant - Analyze

on:
  workflow_dispatch:
  schedule:
    # 09:00-23:30 America/Sao_Paulo (UTC-3), every 30 minutes.
    - cron: '0,30 12-23 * * *'
    - cron: '0,30 0-2 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/analyze.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tennis-quant-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mark analysis running
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "tennis-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "status": "RUNNING",
              "run_id": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "message": "Atualizando resultados de hoje e procurando o board D+1"
          }
          with open("dashboard/run_status.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY
          git add dashboard/run_status.json
          git commit -m "status: tennis analysis running"
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore public tennis history cache
        uses: actions/cache@v4
        with:
          path: data/cache/sackmann
          key: sackmann-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sackmann-${{ runner.os }}-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure multi-source live collector
        run: |
          mkdir -p "$RUNNER_TEMP/tqe-bin"
          cat > "$RUNNER_TEMP/tqe-bin/oddsharvester" <<'EOF'
          #!/usr/bin/env python3
          import subprocess
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          original = sys.argv[1:]

          def option_value(*names):
              for name in names:
                  if name in original:
                      idx = original.index(name)
                      if idx + 1 < len(original):
                          return original[idx + 1]
              return None

          target_date = option_value('-d', '--date')
          output_path = option_value('-o', '--output')

          if target_date and output_path:
              print('[TQE] D+1 source attempt: TennisExplorer dated pages', file=sys.stderr, flush=True)
              completed = subprocess.run([
                  sys.executable,
                  'scripts/tennisexplorer_collector.py',
                  '--date', target_date,
                  '--output', output_path,
              ])
              if completed.returncode == 0:
                  print('[TQE] D+1 source selected: TennisExplorer dated page', file=sys.stderr, flush=True)
                  raise SystemExit(0)

              print('[TQE] D+1 dated page unavailable; discovering active ATP tournaments.', file=sys.stderr, flush=True)
              completed = subprocess.run([
                  sys.executable,
                  'scripts/tennisexplorer_tournament_fallback.py',
                  '--date', target_date,
                  '--output', output_path,
              ])
              if completed.returncode == 0:
                  print('[TQE] D+1 source selected: active tournament pages', file=sys.stderr, flush=True)
                  raise SystemExit(0)

              # A future schedule can legitimately be unpublished yet. Do not spend
              # several minutes downloading Chromium on every 30-minute D+1 cycle.
              today = datetime.now(ZoneInfo('America/Sao_Paulo')).strftime('%Y%m%d')
              if target_date.replace('-', '') > today:
                  print('[TQE] D+1 schedule not published on lightweight sources yet.', file=sys.stderr, flush=True)
                  raise SystemExit(42)

          # Browser fallback remains available for a same-day recovery path only.
          browser = subprocess.run([
              sys.executable, '-m', 'playwright', 'install', '--with-deps', 'chromium'
          ])
          if browser.returncode != 0:
              raise SystemExit(browser.returncode)

          attempts = [
              ('Brazil mirror', 'https://www.oddsagora.com.br', 'pt-BR'),
              ('OddsPortal', None, 'en-US'),
              ('LATAM mirror', 'https://www.cuotasahora.com', 'es-ES'),
              ('Italy mirror', 'https://www.centroquote.it', 'it-IT'),
          ]
          last_code = 1
          for label, base_url, locale in attempts:
              args = list(original)
              args.extend(['--locale', locale])
              if base_url:
                  args.extend(['--base-url', base_url])
              print(f'[TQE] Browser fallback: {label}', file=sys.stderr, flush=True)
              completed = subprocess.run([sys.executable, '-m', 'oddsharvester', *args])
              last_code = completed.returncode
              if completed.returncode == 0:
                  print(f'[TQE] Live source selected: {label}', file=sys.stderr, flush=True)
                  raise SystemExit(0)
          raise SystemExit(last_code)
          EOF
          chmod +x "$RUNNER_TEMP/tqe-bin/oddsharvester"
          echo "$RUNNER_TEMP/tqe-bin" >> "$GITHUB_PATH"

      - name: Test engine
        env:
          PYTHONPATH: src:.
        run: pytest -q

      - name: Update results and analyze D+1 ATP Singles
        env:
          PYTHONPATH: src:.
          H2H_BUDGET: '40'
        run: |
          set -o pipefail
          python -m tennis_quant.cli 2>&1 | tee /tmp/tennis-analysis.log

      - name: Write execution summary
        if: success()
        run: |
          echo "## InvestBet Tennis Engine — D+1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tennis-analysis.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Schedule: every 30 minutes, 09:00-23:30 America/Sao_Paulo" >> "$GITHUB_STEP_SUMMARY"
          echo "D+1: TennisExplorer dated pages -> active ATP tournament pages" >> "$GITHUB_STEP_SUMMARY"
          echo "Results: TennisExplorer public results" >> "$GITHUB_STEP_SUMMARY"
          echo "History: Sackmann-format ATP public history" >> "$GITHUB_STEP_SUMMARY"
          echo "Painel: https://stepoil-debug.github.io/douglas/" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit analysis state and dashboard data
        if: success()
        run: |
          git add data dashboard/data.json dashboard/learning.json
          git diff --cached --quiet || git commit -m "data: update D+1 board and learning"
          git push

      - name: Mark analysis success
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          try:
              data = json.load(open('dashboard/data.json', encoding='utf-8'))
              board_status = data.get('board_status', 'UNKNOWN')
          except Exception:
              board_status = 'UNKNOWN'
          message = (
              'Agenda D+1 ainda não publicada; resultados/aprendizado atualizados e nova tentativa ocorrerá no próximo ciclo.'
              if board_status == 'WAITING_FOR_D1_SCHEDULE'
              else 'Board D+1, resultados e aprendizado atualizados.'
          )
          payload = {
              "status": "SUCCESS",
              "run_id": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "message": message,
              "board_status": board_status,
          }
          with open("dashboard/run_status.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY
          git add dashboard/run_status.json
          git commit -m "status: tennis analysis success"
          git push

      - name: Mark analysis failure
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "tennis-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "status": "FAILED",
              "run_id": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "message": "O motor falhou fora do estado normal de espera D+1. O próximo ciclo tentará novamente."
          }
          with open("dashboard/run_status.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY
          git add dashboard/run_status.json
          git commit -m "status: tennis analysis failed" || true
          git push || true

  deploy-pages:
    needs: analyze
    if: ${{ needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout latest analysis data
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Stage InvestBet dashboard
        run: |
          mkdir -p dashboard/history dashboard/learning
          if compgen -G "data/history/*.json" > /dev/null; then
            cp data/history/*.json dashboard/history/
          fi
          if compgen -G "data/learning/????-??-??.json" > /dev/null; then
            cp data/learning/????-??-??.json dashboard/learning/
          fi
          cp dashboard/v2.html dashboard/index.html
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          dates = []
          for path in sorted(Path('data/history').glob('????-??-??.json'), reverse=True):
              try:
                  row = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              dates.append({
                  'date': row.get('date', path.stem),
                  'updated_at': row.get('updated_at'),
                  'summary': row.get('summary', {}),
              })
          Path('dashboard/history/index.json').write_text(
              json.dumps({'updated_at': datetime.now(timezone.utc).isoformat(), 'dates': dates}, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
      - name: Deploy latest InvestBet dashboard
        id: deployment
        uses: actions/deploy-pages@v4
