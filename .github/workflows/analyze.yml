name: Tennis Quant - Analyze

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/analyze.yml'

permissions:
  contents: write

concurrency:
  group: tennis-quant-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test engine
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Validate API key
        if: env.API_TENNIS_KEY == ''
        run: |
          echo "::error::API_TENNIS_KEY não está configurada. Cadastre em Settings > Secrets and variables > Actions."
          exit 1
      - name: Analyze today's ATP Singles
        env:
          PYTHONPATH: src
          H2H_BUDGET: '40'
        run: python -m tennis_quant.cli | tee /tmp/tennis-analysis.log
      - name: Write execution summary
        if: success()
        run: |
          echo "## Tennis Quant Engine" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tennis-analysis.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Painel: https://stepoil-debug.github.io/douglas/" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit analysis state and dashboard data
        if: success()
        run: |
          git config user.name "tennis-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dashboard/data.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update real tennis analysis"
          git push
