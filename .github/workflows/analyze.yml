name: Tennis Quant - Analyze

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9-23/3 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/analyze.yml'

permissions:
  contents: write

concurrency:
  group: tennis-quant-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mark analysis running
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "tennis-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "status": "RUNNING",
              "run_id": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "message": "Coletando jogos e processando o motor sem API esportiva"
          }
          with open("dashboard/run_status.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY
          git add dashboard/run_status.json
          git commit -m "status: tennis analysis running"
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore public tennis history cache
        uses: actions/cache@v4
        with:
          path: data/cache/sackmann
          key: sackmann-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sackmann-${{ runner.os }}-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for OddsPortal fallback
        run: python -m playwright install --with-deps chromium

      - name: Configure multi-source live collector
        run: |
          mkdir -p "$RUNNER_TEMP/tqe-bin"
          cat > "$RUNNER_TEMP/tqe-bin/oddsharvester" <<'EOF'
          #!/usr/bin/env python3
          import subprocess
          import sys

          original = sys.argv[1:]

          def option_value(*names):
              for name in names:
                  if name in original:
                      idx = original.index(name)
                      if idx + 1 < len(original):
                          return original[idx + 1]
              return None

          target_date = option_value('-d', '--date')
          output_path = option_value('-o', '--output')

          # Primary source: lightweight public HTML with ATP schedule and H/A odds.
          if target_date and output_path:
              print('[TQE] Live source attempt: TennisExplorer', file=sys.stderr, flush=True)
              completed = subprocess.run([
                  sys.executable,
                  'scripts/tennisexplorer_collector.py',
                  '--date', target_date,
                  '--output', output_path,
              ])
              if completed.returncode == 0:
                  print('[TQE] Live source selected: TennisExplorer', file=sys.stderr, flush=True)
                  raise SystemExit(0)
              print('[TQE] TennisExplorer unavailable; falling back to OddsPortal mirrors.', file=sys.stderr, flush=True)

          attempts = [
              ('Brazil mirror', 'https://www.oddsagora.com.br', 'pt-BR'),
              ('OddsPortal', None, 'en-US'),
              ('LATAM mirror', 'https://www.cuotasahora.com', 'es-ES'),
              ('Italy mirror', 'https://www.centroquote.it', 'it-IT'),
          ]
          last_code = 1
          for label, base_url, locale in attempts:
              args = list(original)
              args.extend(['--locale', locale])
              if base_url:
                  args.extend(['--base-url', base_url])
              print(f'[TQE] OddsHarvester attempt: {label}', file=sys.stderr, flush=True)
              completed = subprocess.run([sys.executable, '-m', 'oddsharvester', *args])
              last_code = completed.returncode
              if completed.returncode == 0:
                  print(f'[TQE] Live source selected: {label}', file=sys.stderr, flush=True)
                  raise SystemExit(0)
          raise SystemExit(last_code)
          EOF
          chmod +x "$RUNNER_TEMP/tqe-bin/oddsharvester"
          echo "$RUNNER_TEMP/tqe-bin" >> "$GITHUB_PATH"

      - name: Test engine
        env:
          PYTHONPATH: src:.
        run: pytest -q

      - name: Analyze today's ATP Singles without sports API
        env:
          PYTHONPATH: src:.
          H2H_BUDGET: '40'
        run: |
          set -o pipefail
          python -m tennis_quant.cli 2>&1 | tee /tmp/tennis-analysis.log

      - name: Write execution summary
        if: success()
        run: |
          echo "## Tennis Quant Engine — NO API" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tennis-analysis.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Live: TennisExplorer -> OddsPortal mirrors fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "History: Jeff Sackmann" >> "$GITHUB_STEP_SUMMARY"
          echo "Painel: https://stepoil-debug.github.io/douglas/" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit analysis state and dashboard data
        if: success()
        run: |
          git add data dashboard/data.json
          git diff --cached --quiet || git commit -m "data: update no-api tennis analysis"
          git push

      - name: Mark analysis success
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "status": "SUCCESS",
              "run_id": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "message": "Análise sem API concluída e dados publicados"
          }
          with open("dashboard/run_status.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY
          git add dashboard/run_status.json
          git commit -m "status: tennis analysis success"
          git push

      - name: Mark analysis failure
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "tennis-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "status": "FAILED",
              "run_id": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "message": "A coleta/análise falhou. Use run_id/run_url para consultar o log."
          }
          with open("dashboard/run_status.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY
          git add dashboard/run_status.json
          git commit -m "status: tennis analysis failed" || true
          git push || true
