name: Tennis Quant - Analyze

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9-23/3 * * *'

permissions:
  contents: write

concurrency:
  group: tennis-quant-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore public tennis history cache
        uses: actions/cache@v4
        with:
          path: data/cache/sackmann
          key: sackmann-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sackmann-${{ runner.os }}-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for OddsHarvester
        run: python -m playwright install --with-deps chromium

      - name: OddsHarvester compatibility shim
        run: |
          mkdir -p "$RUNNER_TEMP/tqe-bin"
          cat > "$RUNNER_TEMP/tqe-bin/oddsharvester" <<'EOF'
          #!/usr/bin/env python3
          import subprocess, sys
          args = [a for a in sys.argv[1:] if a != '--include-started']
          raise SystemExit(subprocess.call([sys.executable, '-m', 'oddsharvester', *args]))
          EOF
          chmod +x "$RUNNER_TEMP/tqe-bin/oddsharvester"
          echo "$RUNNER_TEMP/tqe-bin" >> "$GITHUB_PATH"

      - name: Test engine
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Analyze today's ATP Singles without sports API
        env:
          PYTHONPATH: src
          H2H_BUDGET: '40'
        run: python -m tennis_quant.cli | tee /tmp/tennis-analysis.log

      - name: Write execution summary
        if: success()
        run: |
          echo "## Tennis Quant Engine — NO API" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tennis-analysis.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Fontes: OddsHarvester/OddsPortal + Jeff Sackmann" >> "$GITHUB_STEP_SUMMARY"
          echo "Painel: https://stepoil-debug.github.io/douglas/" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit analysis state and dashboard data
        if: success()
        run: |
          git config user.name "tennis-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dashboard/data.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update no-api tennis analysis"
          git push
