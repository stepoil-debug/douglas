name: Tennis Quant - Analyze

on:
  workflow_dispatch:
    inputs:
      api_tennis_key:
        description: 'API-Tennis key (deixe vazio se API_TENNIS_KEY já estiver nos Secrets)'
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: tennis-quant-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_TENNIS_KEY: ${{ inputs.api_tennis_key || secrets.API_TENNIS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test engine
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Validate API key for manual analysis
        if: github.event_name == 'workflow_dispatch' && env.API_TENNIS_KEY == ''
        run: |
          echo "::error::API_TENNIS_KEY ausente. Informe a chave no painel ou cadastre o Secret API_TENNIS_KEY."
          exit 1
      - name: Scheduled run without API key
        if: github.event_name != 'workflow_dispatch' && env.API_TENNIS_KEY == ''
        run: echo "API_TENNIS_KEY ausente; execução automática ignorada sem erro."
      - name: Analyze today's ATP Singles
        if: env.API_TENNIS_KEY != ''
        env:
          PYTHONPATH: src
          H2H_BUDGET: '40'
        run: python -m tennis_quant.cli | tee /tmp/tennis-analysis.log
      - name: Write execution summary
        if: success() && env.API_TENNIS_KEY != ''
        run: |
          echo "## Tennis Quant Engine" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tennis-analysis.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Painel: https://stepoil-debug.github.io/douglas/" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit analysis state and dashboard data
        if: success() && env.API_TENNIS_KEY != ''
        run: |
          git config user.name "tennis-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dashboard/data.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update real tennis analysis"
          git push
