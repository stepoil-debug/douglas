name: Diagnose Football Portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-football-portfolio.yml'
      - 'scripts/diagnose_football_portfolio.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose current board
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/diagnose_football_portfolio.py
